<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>Daily Ref</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%237a29fa'/%3E%3Cpath d='M10 7h12v19l-6-4-6 4z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- 앱 화면 (로그인 후) -->
  <div id="app" hidden>
    <header class="top">
      <div class="wrap">
        <div class="bar">
          <div class="brand"><h1>Daily Ref</h1><span class="today" id="today"></span></div>
          <div class="search">
            <label>
              <span class="sr">검색</span>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
              <input id="q" type="search" placeholder="제목, 메모, 태그, 보낸 사람 검색" autocomplete="off">
              <button class="clear" id="qclear" type="button" aria-label="검색어 지우기" hidden>✕</button>
            </label>
          </div>
          <button class="btn-add" id="addTop" type="button">+ 레퍼런스 추가</button>
          <button class="btn-logout" id="logout" type="button">로그아웃</button>
        </div>
        <nav class="tabs" id="tabs" role="tablist" aria-label="카테고리"></nav>
      </div>
    </header>
    <main class="wrap" id="main" aria-live="polite"></main>
    <div class="fab"><button class="cta" id="addBottom" type="button">+ 레퍼런스 추가</button></div>
  </div>

  <!-- 로그인 화면 -->
  <div id="login" hidden>
    <div class="login">
      <form class="login-card" id="loginForm" novalidate>
        <div>
          <h1>Daily Ref</h1>
          <p>나만 보는 레퍼런스 아카이브</p>
        </div>
        <div class="field">
          <label class="lbl" for="email">이메일</label>
          <input class="input" id="email" type="email" autocomplete="email" placeholder="등록한 이메일 주소">
        </div>
        <button class="cta" id="sendLink" type="submit">로그인 링크 받기</button>
        <div id="loginMsg"></div>
        <div id="googleBox" hidden>
          <div class="or">또는</div>
          <button class="btn-google" id="google" type="button" style="margin-top:18px">
            <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.8 1.1 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3 0 5.8 1.1 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
            Google로 계속하기
          </button>
        </div>
      </form>
    </div>
  </div>

  <div id="bootMsg" class="boot">불러오는 중…</div>
  <div id="layer"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
